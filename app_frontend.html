<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AJAMSI</title>
<style>
body { background: #1e1e2e; color: #e0e0e0; font-family: Arial; padding: 2rem; margin: 0; }
h1 { color: #00d4ff; margin: 0; }
.status { color: #888; font-size: 0.9rem; margin: 0.5rem 0 2rem 0; }
.status.loading { color: #00d4ff; }
.status.error { color: #ff6b6b; }
.status.ready { color: #51cf66; }
.phase-container { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin: 1rem 0; }
.card { background: #222; border: 2px solid #7c3aed; padding: 1rem; border-radius: 8px; }
button { background: #7c3aed; color: white; padding: 0.7rem 1.5rem; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; transition: all 0.2s; }
button:hover { background: #00d4ff; transform: translateY(-2px); }
button:active { transform: translateY(0); }
button.loading { background: #5a2aad; opacity: 0.7; cursor: wait; }
.resultado { background: #2a2a3e; border-left: 4px solid #00d4ff; padding: 0.8rem; margin: 0.5rem 0; border-radius: 4px; }
.error { border-left-color: #ff6b6b; }
h3 { color: #00d4ff; margin-top: 1.5rem; margin-bottom: 0.5rem; }
.noticia-item { background: #2a2a3e; padding: 0.8rem; margin: 0.3rem 0; border-left: 3px solid #7c3aed; border-radius: 3px; }
.noticia-checkbox { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem; background: #2a2a3e; margin: 0.5rem 0; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
.noticia-checkbox:hover { border-color: #00d4ff; }
.noticia-checkbox input { width: 20px; height: 20px; cursor: pointer; }
.noticia-checkbox.selected { background: #1a3a3a; border-color: #51cf66; }
.noticia-info { flex: 1; }
.noticia-titulo { font-weight: bold; color: #00d4ff; }
.noticia-fuente { font-size: 0.85rem; color: #888; }
.btn-continuar { background: #51cf66; margin-top: 1rem; }
.btn-continuar:hover { background: #3db84f; }
.idea-card { background: #2a2a3e; border: 2px solid #7c3aed; padding: 1rem; margin: 0.8rem 0; border-radius: 8px; }
.idea-card textarea { width: 100%; min-height: 100px; background: #1e1e2e; color: #e0e0e0; border: 1px solid #7c3aed; padding: 0.5rem; border-radius: 4px; font-family: monospace; font-size: 0.9rem; margin-top: 0.5rem; }
.idea-meta { font-size: 0.85rem; color: #888; margin: 0.5rem 0; }
.idea-label { color: #00d4ff; font-weight: bold; margin-bottom: 0.5rem; }
.caption-card { background: #2a2a3e; border: 2px solid #51cf66; padding: 1rem; margin: 0.8rem 0; border-radius: 8px; }
.caption-card textarea { width: 100%; min-height: 60px; background: #1e1e2e; color: #e0e0e0; border: 1px solid #51cf66; padding: 0.5rem; border-radius: 4px; font-family: monospace; font-size: 0.9rem; margin-top: 0.5rem; }
.caption-meta { font-size: 0.85rem; color: #888; margin: 0.5rem 0; }
.caption-label { color: #51cf66; font-weight: bold; margin-bottom: 0.5rem; }
.engagement-score { display: inline-block; background: #7c3aed; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.85rem; margin-left: 0.5rem; }
</style>
</head>
<body>
<h1>🚀 AJAMSI Control Panel - HTML NUEVO FUNCIONA!</h1>
<p>Pipeline de generación de contenido automático - ACTUALIZADO</p>
<div class="status" id="status"></div>

<h3>⚙️ Control</h3>
<div class="phase-container">
  <div class="card"><button onclick="verificarSistema()" style="background: #ff9800;">🔍 Verificar Sistema</button></div>
</div>

<div id="healthcheck-result"></div>

<h3>Fases</h3>
<div class="phase-container" id="phases"></div>

<div id="content"></div>

<script>
const API = 'http://localhost:5000/api';
let currentPhaseButton = null;

async function verificarSistema() {
  try {
    const response = await fetch(API + '/healthcheck');
    const data = await response.json();

    let html = '<div style="margin: 1.5rem 0;">';
    html += `<div class="resultado" style="border-left: 4px solid ${response.ok ? '#51cf66' : '#ff6b6b'};">`;
    html += `<strong>${data.mensaje}</strong><br/><br/>`;

    // Mostrar reparaciones realizadas
    if (data.reparaciones && data.reparaciones.length > 0) {
      html += `<div style="margin-bottom: 1rem; padding: 0.5rem; background: rgba(81, 207, 102, 0.2); border-radius: 4px;">`;
      html += `🔧 <strong>Reparaciones realizadas:</strong><br/>`;
      data.reparaciones.forEach(rep => {
        html += `✅ ${rep}<br/>`;
      });
      html += `</div>`;
    }

    if (data.resultados) {
      for (const [nombre, resultado] of Object.entries(data.resultados)) {
        const icon = resultado.status ? '✅' : '❌';
        html += `<div style="margin-bottom: 0.5rem;">${icon} <strong>${nombre}</strong>: ${resultado.mensaje}</div>`;
      }
    }

    html += '</div></div>';
    document.getElementById('healthcheck-result').innerHTML = html;
  } catch (error) {
    console.error('Error verificando sistema:', error);
    alert('Error: ' + error.message);
  }
}

async function executePhase(endpoint, method = 'POST', body = null) {
  try {
    const options = { method };
    if (body) {
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify(body);
    }

    const response = await fetch(API + endpoint, options);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || `Error: ${response.status}`);
    }

    console.log('Response:', data);
    setTimeout(update, 500);
  } catch (error) {
    console.error('Error ejecutando fase:', error);
    alert('Error: ' + error.message);
  }
}

async function mostrarSelectorNoticias() {
  try {
    const response = await fetch(API + '/phase1-get-results');
    const data = await response.json();

    let html = '<h3>📰 Selecciona Noticias (Total: ' + data.total + ')</h3>';
    html += '<p style="color: #888; font-size: 0.9rem;">Marca las noticias que quieres usar para Fase 2</p>';

    data.noticias.forEach((n, i) => {
      const checked = data.seleccionadas.includes(i) ? 'checked' : '';
      const selectedClass = data.seleccionadas.includes(i) ? 'selected' : '';
      html += `<label class="noticia-checkbox ${selectedClass}">
        <input type="checkbox" id="noticia-${i}" ${checked} onchange="actualizarSeleccion()">
        <div class="noticia-info">
          <div class="noticia-titulo">${n.titulo.substring(0, 100)}</div>
          <div class="noticia-fuente">📌 ${n.fuente}</div>
        </div>
      </label>`;
    });

    html += '<button class="btn-continuar" onclick="guardarSeleccionNoticias()">✅ Continuar a Fase 2</button>';

    document.getElementById('content').innerHTML = html;
  } catch (error) {
    console.error('Error mostrando selector:', error);
  }
}

function actualizarSeleccion() {
  const checkboxes = document.querySelectorAll('.noticia-checkbox input');
  checkboxes.forEach((cb, i) => {
    const label = cb.closest('.noticia-checkbox');
    if (cb.checked) {
      label.classList.add('selected');
    } else {
      label.classList.remove('selected');
    }
  });
}

async function guardarSeleccionNoticias() {
  try {
    const checkboxes = document.querySelectorAll('.noticia-checkbox input:checked');
    const indices = Array.from(checkboxes).map(cb => parseInt(cb.id.split('-')[1]));

    if (indices.length === 0) {
      alert('Selecciona al menos una noticia');
      return;
    }

    const response = await fetch(API + '/phase1-select', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ indices })
    });

    const data = await response.json();
    alert('✅ ' + data.mensaje);
  } catch (error) {
    console.error('Error guardando selección:', error);
    alert('Error: ' + error.message);
  }
}

async function mostrarEditorIdeas() {
  try {
    const response = await fetch(API + '/phase2-get-results');
    const data = await response.json();

    let html = '<h3>💡 Revisa y Corrige las Ideas (Total: ' + data.total_ideas + ')</h3>';
    html += '<p style="color: #888; font-size: 0.9rem;">Puedes editar cada idea si es necesario</p>';

    data.ideas.forEach((idea, i) => {
      const concepto = idea.concepto || idea.titulo || 'Sin concepto';
      const descripcion = idea.descripcion || idea.text || '';
      html += `<div class="idea-card">
        <div class="idea-label">💭 Idea ${i + 1}</div>
        <div class="idea-meta">Ángulo: ${idea.angulo_humor || 'N/A'} | Relevancia: ${idea.relevancia || 'N/A'}</div>
        <textarea id="idea-${i}" placeholder="Concepto de idea...">${concepto}</textarea>
        <div style="font-size: 0.85rem; color: #aaa; margin-top: 0.5rem;">Descripción: ${descripcion.substring(0, 150)}</div>
      </div>`;
    });

    html += '<button class="btn-continuar" onclick="guardarIdeasCorregidas()">✅ Continuar a Fase 3</button>';

    document.getElementById('content').innerHTML = html;
  } catch (error) {
    console.error('Error mostrando ideas:', error);
  }
}

async function guardarIdeasCorregidas() {
  try {
    const textareas = document.querySelectorAll('.idea-card textarea');
    const ideas = Array.from(textareas).map((ta, i) => ({
      id: i,
      concepto: ta.value,
      editado: true
    }));

    const response = await fetch(API + '/phase2-correct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ideas })
    });

    const data = await response.json();
    alert('✅ ' + data.mensaje);
  } catch (error) {
    console.error('Error guardando ideas:', error);
    alert('Error: ' + error.message);
  }
}

async function mostrarEditorCaptions() {
  try {
    const response = await fetch(API + '/phase3-get-results');
    const data = await response.json();

    let html = '<h3>✍️ Revisa y Corrige los Captions (Total: ' + data.total_captions + ')</h3>';
    html += '<p style="color: #888; font-size: 0.9rem;">Puedes editar cada caption y sus hashtags</p>';

    data.captions.forEach((caption, i) => {
      const texto = caption.caption || caption.text || 'Sin caption';
      const hashtags = caption.hashtags || '#canarias';
      const engagement = caption.engagement_score || 0;
      const tipo = caption.tipo || 'N/A';

      html += `<div class="caption-card">
        <div class="caption-label">
          📝 Caption ${i + 1}
          <span class="engagement-score">💯 ${(engagement * 100).toFixed(0)}%</span>
        </div>
        <div class="caption-meta">Tipo: ${tipo}</div>
        <textarea id="caption-${i}" placeholder="Texto del caption...">${texto}</textarea>
        <div style="font-size: 0.85rem; margin-top: 0.5rem;">
          <strong>Hashtags:</strong> ${hashtags}
        </div>
      </div>`;
    });

    html += '<button class="btn-continuar" onclick="guardarCaptionsCorregidos()">✅ Continuar a Fase 4 (Video)</button>';

    document.getElementById('content').innerHTML = html;
  } catch (error) {
    console.error('Error mostrando captions:', error);
  }
}

async function guardarCaptionsCorregidos() {
  try {
    const textareas = document.querySelectorAll('.caption-card textarea');
    const captions = Array.from(textareas).map((ta, i) => ({
      id: i,
      caption: ta.value,
      editado: true
    }));

    const response = await fetch(API + '/phase3-correct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ captions })
    });

    const data = await response.json();
    alert('✅ ' + data.mensaje);
  } catch (error) {
    console.error('Error guardando captions:', error);
    alert('Error: ' + error.message);
  }
}

function render(state) {
  // Estado
  const statusEl = document.getElementById('status');
  const statusClass = state.status === 'loading' ? 'loading' : state.status === 'error' ? 'error' : 'ready';
  statusEl.textContent = `Estado: ${state.status.toUpperCase()} | Fase: ${state.current_phase}${state.error ? ' | Error: ' + state.error : ''}`;
  statusEl.className = 'status ' + statusClass;

  // Botones de fases
  let phasesHtml = '';
  phasesHtml += '<div class="card"><button onclick="executePhase(\'/init\', \'GET\')" ' + (state.status === 'loading' ? 'disabled' : '') + '>⚙️ Inicializar</button></div>';
  phasesHtml += '<div class="card"><button onclick="executePhase(\'/phase1\', \'POST\')" ' + (state.status === 'loading' ? 'disabled' : '') + '>1️⃣ Fase 1: Scraping</button></div>';
  phasesHtml += '<div class="card"><button onclick="mostrarSelectorNoticias()" ' + (state.status === 'loading' ? 'disabled' : '') + '>📋 Seleccionar Noticias</button></div>';
  phasesHtml += '<div class="card"><button onclick="executePhase(\'/phase2\', \'POST\', {noticia_idx:0})" ' + (state.status === 'loading' ? 'disabled' : '') + '>2️⃣ Fase 2: Ideas</button></div>';
  phasesHtml += '<div class="card"><button onclick="mostrarEditorIdeas()" ' + (state.status === 'loading' ? 'disabled' : '') + '>📝 Revisar Ideas</button></div>';
  phasesHtml += '<div class="card"><button onclick="executePhase(\'/phase3\', \'POST\')" ' + (state.status === 'loading' ? 'disabled' : '') + '>3️⃣ Fase 3: Captions</button></div>';
  phasesHtml += '<div class="card"><button onclick="mostrarEditorCaptions()" ' + (state.status === 'loading' ? 'disabled' : '') + '>✍️ Revisar Captions</button></div>';
  phasesHtml += '<div class="card"><button onclick="executePhase(\'/phase4\', \'POST\')" ' + (state.status === 'loading' ? 'disabled' : '') + '>4️⃣ Fase 4: Video</button></div>';
  document.getElementById('phases').innerHTML = phasesHtml;

  // Contenido
  let html = '';

  if (state.noticias && state.noticias.length > 0 && state.current_phase === 1) {
    html += '<h3>📰 Noticias (' + state.noticias.length + ')</h3>';
    state.noticias.forEach((n, i) => {
      html += '<div class="noticia-item">' + (n.fuente || 'Noticia') + '<br/><strong>' + (n.titulo ? n.titulo.substring(0, 80) : 'Sin título') + '</strong></div>';
    });
  }

  if (state.ideas && state.ideas.length > 0) {
    html += '<h3>💡 Ideas (' + state.ideas.length + ')</h3>';
    state.ideas.forEach(i => {
      html += '<div class="resultado">Idea: ' + (i.titulo || i.concepto || JSON.stringify(i).substring(0, 100)) + '</div>';
    });
  }

  if (state.prompts && state.prompts.length > 0) {
    html += '<h3>🎨 Prompts (' + state.prompts.length + ')</h3>';
    state.prompts.forEach(p => {
      html += '<div class="resultado">' + (p.prompt || p.description || JSON.stringify(p).substring(0, 100)) + '</div>';
    });
  }

  if (state.captions && state.captions.length > 0) {
    html += '<h3>✍️ Captions (' + state.captions.length + ')</h3>';
    state.captions.forEach(c => {
      html += '<div class="resultado">' + (c.caption || c.text || JSON.stringify(c).substring(0, 100)) + '</div>';
    });
  }

  if (state.video) {
    html += '<h3>🎬 Video Generado</h3>';
    html += '<div class="resultado">Archivo: ' + (state.video.path || state.video.file || JSON.stringify(state.video).substring(0, 100)) + '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

function update() {
  fetch(API + '/state')
    .then(r => r.json())
    .then(state => render(state))
    .catch(e => {
      console.error('Error obteniendo estado:', e);
      document.getElementById('status').textContent = 'Error de conexión con servidor';
      document.getElementById('status').className = 'status error';
    });
}

setInterval(update, 1000);
update();
</script>
</body>
</html>
